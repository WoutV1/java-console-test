name: Java Release Pipeline

# The workflow only triggers when a tag is pushed, not on normal branch pushes
on:
  push:
    tags:
      - '*'

# We need to give the workflow permission to write to the repository to create the release
permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code into runner
        uses: actions/checkout@v2
      - name: Set up JDK 11
        uses: actions/setup-java@v2
        with:
          java-version: '11'
          distribution: 'adopt'
      - name: Test with Maven
        run: mvn test

  deliver-jar:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout repository code into runner
        uses: actions/checkout@v2
      - name: Set up JDK 11
        uses: actions/setup-java@v2
        with:
          java-version: '11'
          distribution: 'adopt'
      - name: Build the JAR file with Maven
        run: mvn package -B
      # Uploading the compiled JAR file as an artifact
      - name: Upload the JAR file to GitHub as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: zipped-project-jar-file
          path: target/*.jar

  release:
    runs-on: ubuntu-latest
    needs: deliver-jar
    steps:
      # Step 1: Download the artifact that was uploaded in the deliver-jar job
      - name: Download the JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: zipped-project-jar-file
          path: ./artifact-dir

      # Step 2: Create the GitHub Release using the downloaded JAR
      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "./artifact-dir/*.jar"
          # GITHUB_TOKEN is automatically provided by GitHub to authorize the release creation
          token: ${{ secrets.GITHUB_TOKEN }}